<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Library Book Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>📚 Library Book Management</h2>
    <form id="bookForm">
        <label>ID: <input type="number" id="id"></label><br><br>
        <label>Title: <input type="text" id="title"></label><br><br>
        <label>Author: <input type="text" id="author"></label><br><br>
        <label>Genre: <input type="text" id="genre"></label><br><br>
        <label>Year: <input type="number" id="year"></label><br><br>

        <button type="button" id="addBtn">Add Book</button><br><br>
        <button type="button" id="clearBtn">Clear Form</button>
        <button type="button" id="exportBtn">Export XML</button>
    </form>

    <h3>Book Collection</h3>
    <table id="bookTable">
        <thead>
            <tr>
                <th>ID</th><th>Title</th><th>Author</th><th>Genre</th><th>Year</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <footer>Student: Ritik Mishra | BITS ID: 2022wa86217</footer>

    <script src="script.js"></script>
</body>
</html>
